<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NumTick - 자동 슈팅 서바이벌</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-overlay">
            <div id="hud">
                <div id="hp-bar-container">
                    <div id="hp-bar"></div>
                    <span id="hp-text"></span>
                </div>
                <div id="exp-bar-container">
                    <div id="exp-bar"></div>
                    <span id="level-text"></span>
                </div>
                <div id="stats-display">
                    <span id="kill-count">처치: 0</span>
                    <span id="time-display">00:00</span>
                    <span id="stage-display">스테이지 1</span>
                </div>
            </div>

            <div id="skill-selection" class="hidden">
                <h2>레벨 업!</h2>
                <div id="skill-options"></div>
            </div>

            <div id="start-screen">
                <h1>NumTick</h1>
                <p class="subtitle">자동 슈팅 서바이벌</p>
                <button id="start-btn">게임 시작</button>
                <div class="controls-info">
                    <p>이동: WASD / 방향키</p>
                    <p>공격: 자동</p>
                    <p>목표: 최대한 오래 생존하라!</p>
                </div>
            </div>

            <div id="game-over-screen" class="hidden">
                <h1>게임 오버</h1>
                <div id="game-over-stats"></div>
                <button id="restart-btn">다시 시작</button>
            </div>

            <div id="boss-warning" class="hidden">
                <span>⚠ 보스 출현 ⚠</span>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/projectiles.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
